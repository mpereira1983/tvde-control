<!DOCTYPE html>
<html lang="pt-PT" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#020617" />
  <title>TVDE Control — Portugal</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React & ReactDOM (UMD Production) -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- Babel Standalone para compilar JSX diretamente no navegador -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
    body {
      font-family: 'Inter', sans-serif;
      background-color: #020617;
      color: #f1f5f9;
      -webkit-tap-highlight-color: transparent;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fadeIn {
      animation: fadeIn 0.25s ease-out;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // ==========================================
    // COMPONENTE DE ÍCONES LUCIDE SEGURO PARA HTML
    // ==========================================
    function Icon({ name, className = "w-4 h-4" }) {
      const containerRef = useRef(null);

      useEffect(() => {
        if (!containerRef.current || !window.lucide) return;
        const iconDef = window.lucide.icons[name];
        if (!iconDef) return;

        // Limpa e cria o SVG oficial do Lucide
        containerRef.current.innerHTML = '';
        const svgElement = window.lucide.createElement(iconDef);
        svgElement.setAttribute('class', className);
        containerRef.current.appendChild(svgElement);
      }, [name, className]);

      return <span ref={containerRef} className="inline-flex items-center justify-center shrink-0" />;
    }

    // ==========================================
    // CATEGORIAS DE DESPESAS
    // ==========================================
    const EXPENSE_CATEGORIES = [
      { id: 'combustivel', label: 'Combustível / Carregamento', icon: 'Fuel', color: 'text-amber-400 bg-amber-500/10 border-amber-500/20' },
      { id: 'portagens', label: 'Portagens / Via Verde', icon: 'Navigation', color: 'text-blue-400 bg-blue-500/10 border-blue-500/20' },
      { id: 'lavagem', label: 'Lavagem & Limpeza', icon: 'Sparkles', color: 'text-cyan-400 bg-cyan-500/10 border-cyan-500/20' },
      { id: 'manutencao', label: 'Manutenção / Oficina', icon: 'Wrench', color: 'text-rose-400 bg-rose-500/10 border-rose-500/20' },
      { id: 'seguro', label: 'Seguros & Licenças', icon: 'Receipt', color: 'text-purple-400 bg-purple-500/10 border-purple-500/20' },
      { id: 'outros', label: 'Outros Custos', icon: 'DollarSign', color: 'text-gray-400 bg-gray-500/10 border-gray-500/20' },
    ];

    function App() {
      // Separadores: 'resumo', 'turnos', 'despesas', 'exportar'
      const [activeTab, setActiveTab] = useState('resumo');

      // Estado Principal (Persistido em localStorage)
      const [shifts, setShifts] = useState(() => {
        try {
          const saved = localStorage.getItem('tvde_shifts');
          return saved ? JSON.parse(saved) : [];
        } catch {
          return [];
        }
      });

      const [expenses, setExpenses] = useState(() => {
        try {
          const saved = localStorage.getItem('tvde_expenses');
          return saved ? JSON.parse(saved) : [];
        } catch {
          return [];
        }
      });

      const [isFullscreen, setIsFullscreen] = useState(false);

      // Filtro Temporal: 'hoje', 'semana', 'mes', 'dia', 'tudo'
      const [timePeriod, setTimePeriod] = useState('semana');
      const [selectedDay, setSelectedDay] = useState(() => new Date().toISOString().slice(0, 10));
      const [selectedWeek, setSelectedWeek] = useState(() => {
        // Calcula a segunda-feira da semana atual (YYYY-MM-DD)
        const now = new Date();
        const dayOfWeek = now.getDay() === 0 ? 6 : now.getDay() - 1;
        const monday = new Date(now.getFullYear(), now.getMonth(), now.getDate() - dayOfWeek);
        return new Date(monday.getTime() - monday.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
      });
      const [selectedMonth, setSelectedMonth] = useState(() => {
        // Mês atual no formato YYYY-MM para o seletor de mês
        const now = new Date();
        return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
      });

      // Modais
      const [isStartShiftOpen, setIsStartShiftOpen] = useState(false);
      const [isCloseShiftOpen, setIsCloseShiftOpen] = useState(false);
      const [isManualShiftOpen, setIsManualShiftOpen] = useState(false);
      const [isExpenseModalOpen, setIsExpenseModalOpen] = useState(false);
      const [editingShift, setEditingShift] = useState(null);
      const [editingExpense, setEditingExpense] = useState(null);

      // Notificações Toast
      const [toast, setToast] = useState(null);

      const showToast = (message, type = 'success') => {
        setToast({ message, type });
        setTimeout(() => setToast(null), 3500);
      };

      // Listener de Ecrã Inteiro
      useEffect(() => {
        const handleFullscreenChange = () => {
          setIsFullscreen(Boolean(document.fullscreenElement));
        };
        document.addEventListener('fullscreenchange', handleFullscreenChange);
        return () => document.removeEventListener('fullscreenchange', handleFullscreenChange);
      }, []);

      const toggleFullscreen = async () => {
        try {
          if (!document.fullscreenElement) {
            if (document.documentElement.requestFullscreen) {
              await document.documentElement.requestFullscreen();
            }
          } else if (document.exitFullscreen) {
            await document.exitFullscreen();
          }
        } catch (err) {
          console.error("Erro ao alternar ecrã inteiro:", err);
          showToast("Ecrã inteiro indisponível neste modo.", "info");
        }
      };

      // Turno ativo em curso
      const activeShift = useMemo(() => {
        return shifts.find(s => s.status === 'em_curso');
      }, [shifts]);

      // Gráfico Diário da Semana (Segunda a Domingo)
      const weeklyChartData = useMemo(() => {
        const days = [];
        const now = new Date();
        const dayOfWeek = now.getDay() === 0 ? 6 : now.getDay() - 1;
        const startOfWeek = new Date(now.getFullYear(), now.getMonth(), now.getDate() - dayOfWeek, 0, 0, 0, 0);
        const dayNames = ['Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb', 'Dom'];

        for (let i = 0; i < 7; i++) {
          const d = new Date(startOfWeek.getFullYear(), startOfWeek.getMonth(), startOfWeek.getDate() + i);
          const dateKey = new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);

          let uber = 0;
          let bolt = 0;
          let extras = 0;
          let tripsCount = 0;

          shifts.forEach(s => {
            if (s.status === 'concluido' && s.startTime) {
              const sDate = new Date(s.startTime);
              const sKey = new Date(sDate.getTime() - sDate.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
              if (sKey === dateKey) {
                uber += Number(s.uberGanhos || 0);
                bolt += Number(s.boltGanhos || 0);
                extras += Number(s.extrasGanhos || 0);
                tripsCount += (s.trips?.length || Number(s.totalViagens || 0));
              }
            }
          });

          days.push({
            dateKey,
            label: dayNames[i],
            dayNum: d.getDate(),
            uber,
            bolt,
            extras,
            total: uber + bolt + extras,
            tripsCount
          });
        }

        const maxTotal = Math.max(...days.map(d => d.total), 1);
        return { days, maxTotal };
      }, [shifts]);

      // Filtragem por Período
      const filteredData = useMemo(() => {
        const now = new Date();
        const startOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate());

        // Semana fixa de Segunda-feira (00:00:00) a Domingo (23:59:59.999)
        const dayOfWeek = now.getDay() === 0 ? 6 : now.getDay() - 1;
        const startOfWeek = new Date(now.getFullYear(), now.getMonth(), now.getDate() - dayOfWeek, 0, 0, 0, 0);
        const endOfWeek = new Date(startOfWeek.getFullYear(), startOfWeek.getMonth(), startOfWeek.getDate() + 6, 23, 59, 59, 999);

        // Semana escolhida manualmente a partir da segunda-feira selecionada
        const [wkY, wkM, wkD] = selectedWeek.split('-').map(Number);
        const customWeekStart = new Date(wkY, (wkM || 1) - 1, wkD || 1, 0, 0, 0, 0);
        const customWeekEnd = new Date(customWeekStart.getFullYear(), customWeekStart.getMonth(), customWeekStart.getDate() + 6, 23, 59, 59, 999);

        // Mês atual e mês escolhido manualmente (YYYY-MM)
        const startOfMonth = new Date(now.getFullYear(), now.getMonth(), 1, 0, 0, 0, 0);
        const [selYear, selMonth] = selectedMonth.split('-').map(Number);
        const customMonthStart = new Date(selYear, (selMonth || 1) - 1, 1, 0, 0, 0, 0);
        const customMonthEnd = new Date(selYear, (selMonth || 1), 0, 23, 59, 59, 999);

        const filterFn = (dateStr) => {
          const d = new Date(dateStr);
          if (isNaN(d.getTime())) return false;
          if (timePeriod === 'hoje') return d >= startOfToday;
          if (timePeriod === 'semana') return d >= startOfWeek && d <= endOfWeek;
          if (timePeriod === 'semana_escolhida') return d >= customWeekStart && d <= customWeekEnd;
          if (timePeriod === 'mes') return d >= startOfMonth;
          if (timePeriod === 'mes_escolhido') return d >= customMonthStart && d <= customMonthEnd;
          if (timePeriod === 'dia') {
            const localKey = new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
            return localKey === selectedDay;
          }
          return true;
        };

        const completedShifts = shifts.filter(s => s.status === 'concluido' && filterFn(s.startTime));
        const periodExpenses = expenses.filter(e => filterFn(e.date));

        let uberGanhos = 0;
        let boltGanhos = 0;
        let extrasGanhos = 0;
        let totalKm = 0;
        let totalHoras = 0;
        let totalViagens = 0;

        completedShifts.forEach(s => {
          uberGanhos += Number(s.uberGanhos || 0);
          boltGanhos += Number(s.boltGanhos || 0);
          extrasGanhos += Number(s.extrasGanhos || 0);
          totalViagens += (s.trips?.length || Number(s.totalViagens || 0));

          const kmStart = Number(s.kmInicio || 0);
          const kmEnd = Number(s.kmFim || 0);
          if (kmEnd > kmStart) totalKm += (kmEnd - kmStart);

          if (s.startTime && s.endTime) {
            const diffMs = new Date(s.endTime) - new Date(s.startTime);
            if (diffMs > 0) totalHoras += diffMs / (1000 * 60 * 60);
          }
        });

        const totalFaturado = uberGanhos + boltGanhos + extrasGanhos;
        const totalDespesas = periodExpenses.reduce((sum, e) => sum + Number(e.amount || 0), 0);
        const lucroLiquido = totalFaturado - totalDespesas;
        const mediaEuroHora = totalHoras > 0 ? lucroLiquido / totalHoras : 0;
        const mediaEuroKm = totalKm > 0 ? lucroLiquido / totalKm : 0;

        return {
          shifts: completedShifts,
          expenses: periodExpenses,
          totalFaturado,
          uberGanhos,
          boltGanhos,
          extrasGanhos,
          totalDespesas,
          lucroLiquido,
          totalKm,
          totalHoras,
          totalViagens,
          mediaEuroHora,
          mediaEuroKm
        };
      }, [shifts, expenses, timePeriod, selectedDay]);

      // Persistência Local
      const saveShift = (shiftData) => {
        try {
          setShifts(prev => {
            let updated;
            if (shiftData.id) {
              const exists = prev.some(s => s.id === shiftData.id);
              updated = exists
                ? prev.map(s => s.id === shiftData.id ? shiftData : s)
                : [shiftData, ...prev];
            } else {
              updated = [{ ...shiftData, id: 'shift_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6) }, ...prev];
            }
            updated.sort((a, b) => new Date(b.startTime) - new Date(a.startTime));
            localStorage.setItem('tvde_shifts', JSON.stringify(updated));
            return updated;
          });
          showToast(shiftData.status === 'em_curso' ? "Turno iniciado!" : "Turno gravado com sucesso!");
        } catch (err) {
          console.error(err);
          showToast("Erro ao guardar turno.", "error");
        }
      };

      const deleteShift = (id) => {
        try {
          setShifts(prev => {
            const updated = prev.filter(s => s.id !== id);
            localStorage.setItem('tvde_shifts', JSON.stringify(updated));
            return updated;
          });
          showToast("Turno eliminado.");
        } catch (err) {
          console.error(err);
          showToast("Erro ao eliminar.", "error");
        }
      };

      const saveExpense = (expenseData) => {
        try {
          setExpenses(prev => {
            let updated;
            if (expenseData.id) {
              const exists = prev.some(e => e.id === expenseData.id);
              updated = exists
                ? prev.map(e => e.id === expenseData.id ? expenseData : e)
                : [expenseData, ...prev];
            } else {
              updated = [{ ...expenseData, id: 'exp_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6) }, ...prev];
            }
            updated.sort((a, b) => new Date(b.date) - new Date(a.date));
            localStorage.setItem('tvde_expenses', JSON.stringify(updated));
            return updated;
          });
          showToast("Despesa registada!");
        } catch (err) {
          console.error(err);
          showToast("Erro ao guardar despesa.", "error");
        }
      };

      const deleteExpense = (id) => {
        try {
          setExpenses(prev => {
            const updated = prev.filter(e => e.id !== id);
            localStorage.setItem('tvde_expenses', JSON.stringify(updated));
            return updated;
          });
          showToast("Despesa eliminada.");
        } catch (err) {
          console.error(err);
          showToast("Erro ao eliminar.", "error");
        }
      };

      // Dados de Demonstração
      const loadDemoData = () => {
        const now = new Date();
        const demoShifts = [];
        const demoExpenses = [];

        for (let i = 0; i < 6; i++) {
          const day = new Date(now);
          day.setDate(now.getDate() - i);
          const startTime = new Date(day.setHours(7, 30, 0)).toISOString();
          const endTime = new Date(day.setHours(17, 0, 0)).toISOString();

          const sampleTrips = [
            { id: 't1_' + i, platform: 'uber', amount: 14.50, time: '08:15', note: 'Almada -> Marquês' },
            { id: 't2_' + i, platform: 'bolt', amount: 18.20, time: '09:40', note: 'Saldanha -> Aeroporto' },
            { id: 't3_' + i, platform: 'uber', amount: 22.80, time: '11:10', note: 'Aeroporto -> Parque das Nações' },
            { id: 't4_' + i, platform: 'bolt', amount: 11.40, time: '14:25', note: 'Oriente -> Baixa' },
            { id: 't5_' + i, platform: 'uber', amount: 16.90, time: '16:05', note: 'Cais do Sodré -> Almada' },
          ];

          const uberSum = sampleTrips.filter(t => t.platform === 'uber').reduce((acc, t) => acc + t.amount, 0);
          const boltSum = sampleTrips.filter(t => t.platform === 'bolt').reduce((acc, t) => acc + t.amount, 0);

          demoShifts.push({
            id: 'demo_shift_' + i,
            startTime,
            endTime,
            kmInicio: 120000 + (i * 220),
            kmFim: 120000 + (i * 220) + 210,
            uberGanhos: Number(uberSum.toFixed(2)),
            boltGanhos: Number(boltSum.toFixed(2)),
            extrasGanhos: i % 2 === 0 ? 5.00 : 0,
            trips: sampleTrips,
            totalViagens: sampleTrips.length,
            notes: i === 0 ? "Bons serviços no aeroporto" : "",
            status: 'concluido'
          });
        }

        const expNow = new Date();
        demoExpenses.push(
          {
            id: 'demo_exp_1',
            date: new Date(new Date().setDate(expNow.getDate() - 1)).toISOString(),
            category: 'combustivel',
            amount: 45.00,
            notes: 'Abastecimento Galp'
          },
          {
            id: 'demo_exp_2',
            date: new Date(new Date().setDate(expNow.getDate() - 3)).toISOString(),
            category: 'portagens',
            amount: 12.40,
            notes: 'Via Verde Semanal'
          },
          {
            id: 'demo_exp_3',
            date: new Date(new Date().setDate(expNow.getDate() - 4)).toISOString(),
            category: 'lavagem',
            amount: 8.50,
            notes: 'Lavagem exterior e aspiração'
          }
        );

        demoShifts.forEach(s => saveShift(s));
        demoExpenses.forEach(e => saveExpense(e));
        showToast("Dados de demonstração carregados!");
      };

      return (
        <div className="min-h-screen bg-slate-950 text-slate-100 flex flex-col pb-24 md:pb-6 select-none">

          {/* TOAST */}
          {toast && (
            <div className={`fixed top-4 left-1/2 -translate-x-1/2 z-50 px-4 py-3 rounded-xl shadow-2xl flex items-center gap-3 border text-sm font-semibold transition-all animate-bounce ${
              toast.type === 'error'
                ? 'bg-rose-950/95 border-rose-500/50 text-rose-200'
                : 'bg-emerald-950/95 border-emerald-500/50 text-emerald-200'
            }`}>
              <Icon name={toast.type === 'error' ? 'AlertCircle' : 'CheckCircle2'} className={`w-5 h-5 ${toast.type === 'error' ? 'text-rose-400' : 'text-emerald-400'}`} />
              {toast.message}
            </div>
          )}

          {/* HEADER */}
          <header className="sticky top-0 z-40 bg-slate-900/90 backdrop-blur-md border-b border-slate-800/80 px-4 py-3">
            <div className="max-w-5xl mx-auto flex items-center justify-between">
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-emerald-500 to-teal-400 flex items-center justify-center shadow-lg shadow-emerald-500/20 text-slate-950">
                  <Icon name="Car" className="w-6 h-6" />
                </div>
                <div>
                  <h1 className="font-black text-lg tracking-tight bg-gradient-to-r from-white via-slate-200 to-slate-400 bg-clip-text text-transparent">
                    TVDE Control
                  </h1>
                  <span className="text-[10px] font-medium tracking-wider text-emerald-400 uppercase bg-emerald-950/60 border border-emerald-800/40 px-1.5 py-0.5 rounded">
                    Portugal
                  </span>
                </div>
              </div>

              <div className="flex items-center gap-2">
                <div className="flex items-center gap-2 text-xs bg-slate-800/60 border border-slate-700/60 rounded-full px-3 py-1 text-slate-300">
                  <Icon name="UserCheck" className="w-3.5 h-3.5 text-emerald-400" />
                  <span>Motorista</span>
                </div>

                <button
                  type="button"
                  onClick={toggleFullscreen}
                  title={isFullscreen ? "Sair de ecrã inteiro" : "Ecrã inteiro"}
                  aria-label={isFullscreen ? "Sair de ecrã inteiro" : "Ecrã inteiro"}
                  className="p-2 rounded-xl bg-slate-800/70 hover:bg-slate-700 border border-slate-700/70 text-emerald-400 transition active:scale-95"
                >
                  <Icon name={isFullscreen ? "Minimize2" : "Maximize2"} className="w-4 h-4" />
                </button>
              </div>
            </div>
          </header>

          {/* BANNER DE TURNO ATIVO */}
          {activeShift && (
            <div className="bg-gradient-to-r from-emerald-950 via-teal-950 to-slate-900 border-b border-emerald-500/30 px-4 py-3">
              <div className="max-w-5xl mx-auto flex flex-wrap items-center justify-between gap-3">
                <div className="flex items-center gap-3">
                  <span className="relative flex h-3 w-3">
                    <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                    <span className="relative inline-flex rounded-full h-3 w-3 bg-emerald-500"></span>
                  </span>
                  <div>
                    <p className="text-xs font-bold uppercase tracking-wider text-emerald-400">Turno em Curso</p>
                    <p className="text-sm font-semibold text-white">
                      Iniciado às {new Date(activeShift.startTime).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })} • {activeShift.kmInicio} km
                    </p>
                  </div>
                </div>
                <button
                  onClick={() => setIsCloseShiftOpen(true)}
                  className="bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold px-4 py-2 rounded-xl text-sm flex items-center gap-2 transition shadow-lg shadow-emerald-500/20 active:scale-95"
                >
                  <Icon name="Square" className="w-4 h-4" />
                  Fechar Turno
                </button>
              </div>
            </div>
          )}

          {/* CONTEÚDO PRINCIPAL */}
          <main className="flex-1 max-w-5xl w-full mx-auto px-4 py-5">

            {/* TAB 1: RESUMO */}
            {activeTab === 'resumo' && (
              <div className="space-y-6 animate-fadeIn">

                {/* Filtros e Iniciar Turno */}
                <div className="flex flex-wrap items-center justify-between gap-3 bg-slate-900/60 p-2 rounded-2xl border border-slate-800">
                  <div className="flex flex-wrap items-center gap-1.5 w-full sm:w-auto">
                    <div className="flex flex-wrap items-center gap-1 bg-slate-950 p-1 rounded-xl border border-slate-800/80 flex-1 sm:flex-initial">
                      {[
                        { id: 'hoje', label: 'Hoje' },
                        { id: 'semana', label: 'Esta Semana' },
                        { id: 'semana_escolhida', label: 'Escolher Semana' },
                        { id: 'mes', label: 'Este Mês' },
                        { id: 'mes_escolhido', label: 'Escolher Mês' },
                        { id: 'dia', label: 'Dia' },
                        { id: 'tudo', label: 'Tudo' },
                      ].map((item) => (
                        <button
                          key={item.id}
                          onClick={() => setTimePeriod(item.id)}
                          className={`flex-1 sm:flex-none px-3 py-1.5 rounded-lg text-xs font-bold transition ${
                            timePeriod === item.id
                              ? 'bg-emerald-500 text-slate-950 shadow-md shadow-emerald-500/10'
                              : 'text-slate-400 hover:text-white'
                          }`}
                        >
                          {item.label}
                        </button>
                      ))}
                    </div>

                    {timePeriod === 'semana_escolhida' && (
                      <div className="flex items-center gap-1.5 bg-slate-950 border border-emerald-500/40 rounded-xl px-2.5 py-1">
                        <span className="text-[10px] font-bold text-emerald-400 uppercase">Seg:</span>
                        <input
                          type="date"
                          value={selectedWeek}
                          onChange={(e) => {
                            if (!e.target.value) return;
                            // Ajusta automaticamente para a segunda-feira da semana escolhida
                            const parts = e.target.value.split('-').map(Number);
                            const picked = new Date(parts[0], (parts[1] || 1) - 1, parts[2] || 1);
                            const dow = picked.getDay() === 0 ? 6 : picked.getDay() - 1;

    function CloseShiftModal({ shift, onClose, onFinish }) {
      const nowLocal = new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 16);
      const [endTime, setEndTime] = useState(nowLocal);
      const [kmFim, setKmFim] = useState('');
      const [trips, setTrips] = useState(shift.trips || []);
      const [tripPlatform, setTripPlatform] = useState('uber');
      const [tripAmount, setTripAmount] = useState('');
      const [tripNote, setTripNote] = useState('');
      const [uberGanhos, setUberGanhos] = useState(shift.uberGanhos || '');
      const [boltGanhos, setBoltGanhos] = useState(shift.boltGanhos || '');
      const [extrasGanhos, setExtrasGanhos] = useState(shift.extrasGanhos || '');
      const [notes, setNotes] = useState(shift.notes || '');

      const syncTotalsFromTrips = (updatedTrips) => {
        const uberSum = updatedTrips.filter(t => t.platform === 'uber').reduce((s, t) => s + Number(t.amount || 0), 0);
        const boltSum = updatedTrips.filter(t => t.platform === 'bolt').reduce((s, t) => s + Number(t.amount || 0), 0);
        const extrasSum = updatedTrips.filter(t => t.platform === 'extras').reduce((s, t) => s + Number(t.amount || 0), 0);
        setUberGanhos(uberSum ? uberSum.toFixed(2) : '');
        setBoltGanhos(boltSum ? boltSum.toFixed(2) : '');
        setExtrasGanhos(extrasSum ? extrasSum.toFixed(2) : '');
      };

      const handleAddTrip = () => {
        const val = parseFloat(tripAmount);
        if (!val || val <= 0) return;
        const newTrip = {
          id: 'trip_' + Date.now(),
          platform: tripPlatform,
          amount: val,
          time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
          note: tripNote.trim()
        };
        const updated = [...trips, newTrip];
        setTrips(updated);
        syncTotalsFromTrips(updated);
        setTripAmount('');
        setTripNote('');
      };

      const handleRemoveTrip = (id) => {
        const updated = trips.filter(t => t.id !== id);
        setTrips(updated);
        syncTotalsFromTrips(updated);
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        onFinish({
          ...shift,
          endTime: new Date(endTime).toISOString(),
          kmFim: Number(kmFim) || shift.kmInicio,
          trips,
          totalViagens: trips.length,
          uberGanhos: Number(uberGanhos) || 0,
          boltGanhos: Number(boltGanhos) || 0,
          extrasGanhos: Number(extrasGanhos) || 0,
          notes,
          status: 'concluido'
        });
      };

      return (
        <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-md p-5 space-y-4 shadow-2xl max-h-[90vh] overflow-y-auto">
            <div className="flex items-center justify-between">
              <h3 className="font-bold text-base text-white flex items-center gap-2">
                <Icon name="Square" className="w-4 h-4 text-emerald-400" />
                Fechar Turno ({shift.kmInicio} km)
              </h3>
              <button onClick={onClose} className="p-1 text-slate-400 hover:text-white">
                <Icon name="X" className="w-5 h-5" />
              </button>
            </div>

            <form onSubmit={handleSubmit} className="space-y-3 text-xs">
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div>
                  <label className="block text-slate-400 font-semibold mb-1">Data e Hora de Fim</label>
                  <input
                    type="datetime-local"
                    required
                    value={endTime}
                    onChange={(e) => setEndTime(e.target.value)}
                    className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-emerald-500"
                  />
                </div>

                <div>
                  <label className="block text-slate-400 font-semibold mb-1">Km Finais (Início: {shift.kmInicio})</label>
                  <input
                    type="number"
                    required
                    min={shift.kmInicio}
                    placeholder={`> ${shift.kmInicio}`}
                    value={kmFim}
                    onChange={(e) => setKmFim(e.target.value)}
                    className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-emerald-500"
                  />
                </div>
              </div>

              <div className="bg-slate-950/90 border border-slate-800 rounded-xl p-3 space-y-2.5">
                <div className="flex items-center justify-between">
                  <span className="font-bold text-slate-200">Viagens do Turno ({trips.length})</span>
                  <span className="text-[10px] text-emerald-400">Soma automática nos totais</span>
                </div>

                <div className="grid grid-cols-12 gap-1.5">
                  <select
                    value={tripPlatform}
                    onChange={(e) => setTripPlatform(e.target.value)}
                    className="col-span-4 bg-slate-900 border border-slate-800 rounded-lg px-2 py-2 text-white focus:outline-none focus:border-emerald-500"
                  >
                    <option value="uber">Uber</option>
                    <option value="bolt">Bolt</option>
                    <option value="extras">Extra</option>
                  </select>
                  <input
                    type="number"
                    step="0.01"
                    placeholder="Valor €"
                    value={tripAmount}
                    onChange={(e) => setTripAmount(e.target.value)}
                    className="col-span-4 bg-slate-900 border border-slate-800 rounded-lg px-2 py-2 text-white focus:outline-none focus:border-emerald-500"
                  />
                  <input
                    type="text"
                    placeholder="Trajeto (opc.)"
                    value={tripNote}
                    onChange={(e) => setTripNote(e.target.value)}
                    className="col-span-4 bg-slate-900 border border-slate-800 rounded-lg px-2 py-2 text-white focus:outline-none focus:border-emerald-500"
                  />
                </div>

                <button
                  type="button"
                  onClick={handleAddTrip}
                  className="w-full bg-slate-800 hover:bg-slate-700 text-emerald-400 font-bold py-2 rounded-lg flex items-center justify-center gap-1 transition border border-slate-700"
                >
                  <Icon name="Plus" className="w-3.5 h-3.5" />
                  Adicionar Viagem
                </button>

                {trips.length > 0 && (
                  <div className="max-h-28 overflow-y-auto space-y-1 pt-1">
                    {trips.map((t) => (
                      <div key={t.id} className="flex items-center justify-between bg-slate-900 px-2.5 py-1.5 rounded-lg border border-slate-800/80">
                        <div className="flex items-center gap-2 truncate">
                          <span className={`uppercase font-bold text-[10px] px-1.5 py-0.5 rounded ${
                            t.platform === 'bolt' ? 'bg-emerald-500/20 text-emerald-400' : 'bg-slate-800 text-slate-300'
                          }`}>
                            {t.platform}
                          </span>
                          <span className="font-bold text-white">€{Number(t.amount).toFixed(2)}</span>
                          {t.note && <span className="text-slate-400 truncate">• {t.note}</span>}
                        </div>
                        <button
                          type="button"
                          onClick={() => handleRemoveTrip(t.id)}
                          className="text-slate-500 hover:text-rose-400 p-0.5"
                        >
                          <Icon name="X" className="w-3.5 h-3.5" />
                        </button>
                      </div>
                    ))}
                  </div>
                )}
              </div>

              <div className="grid grid-cols-3 gap-2">
                <div>
                  <label className="block text-slate-400 font-semibold mb-1">Total Uber (€)</label>
                  <input
                    type="number"
                    step="0.01"
                    placeholder="0.00"
                    value={uberGanhos}
                    onChange={(e) => setUberGanhos(e.target.value)}
                    className="w-full bg-slate-950 border border-slate-800 rounded-xl px-2.5 py-2 text-white focus:outline-none focus:border-emerald-500"
                  />
                </div>
                <div>
                  <label className="block text-slate-400 font-semibold mb-1">Total Bolt (€)</label>
                  <input
                    type="number"
                    step="0.01"
                    placeholder="0.00"
                    value={boltGanhos}
                    onChange={(e) => setBoltGanhos(e.target.value)}
                    className="w-full bg-slate-950 border border-slate-800 rounded-xl px-2.5 py-2 text-white focus:outline-none focus:border-emerald-500"
                  />
                </div>
                <div>
                  <label className="block text-slate-400 font-semibold mb-1">Extras (€)</label>
                  <input
                    type="number"
                    step="0.01"
                    placeholder="0.00"
                    value={extrasGanhos}
                    onChange={(e) => setExtrasGanhos(e.target.value)}
                    className="w-full bg-slate-950 border border-slate-800 rounded-xl px-2.5 py-2 text-white focus:outline-none focus:border-emerald-500"
                  />
                </div>
              </div>

              <div>
                <label className="block text-slate-400 font-semibold mb-1">Observações</label>
                <input
                  type="text"
                  placeholder="Notas sobre o turno..."
                  value={notes}
                  onChange={(e) => setNotes(e.target.value)}
                  className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-emerald-500"
                />

              <div className="flex gap-2 pt-2">
                <button type="button" onClick={onClose} className="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold py-3 rounded-xl transition">
                  Cancelar
                </button>
                <button type="submit" className="flex-1 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold py-3 rounded-xl transition">
                  Concluir Turno
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    function ManualShiftModal({ shift, onClose, onSave }) {
      const toLocalInput = (iso) => {
        if (!iso) return new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 16);
        const d = new Date(iso);
        return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 16);
      };

      const [startTime, setStartTime] = useState(toLocalInput(shift?.startTime));

        const boltSum = updatedTrips.filter(t => t.platform === 'bolt').reduce((s, t) => s + Number(t.amount || 0), 0);
        const extrasSum = updatedTrips.filter(t => t.platform === 'extras').reduce((s, t) => s + Number(t.amount || 0), 0);
        setUberGanhos(uberSum ? uberSum.toFixed(2) : '');
        setBoltGanhos(boltSum ? boltSum.toFixed(2) : '');
        setExtrasGanhos(extrasSum ? extrasSum.toFixed(2) : '');

      const handleAddTrip = () => {
        const val = parseFloat(tripAmount);
        if (!val || val <= 0) return;
        const newTrip = {
          id: 'trip_' + Date.now(),
          platform: tripPlatform,
          amount: val,
          time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
          note: tripNote.trim()
        };
        const updated = [...trips, newTrip];
        setTrips(updated);
        syncTotalsFromTrips(updated);
        setTripAmount('');
        setTripNote('');
      };

      const handleRemoveTrip = (id) => {
        const updated = trips.filter(t => t.id !== id);
        setTrips(updated);
        syncTotalsFromTrips(updated);
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        onSave({
          ...(shift || {}),
          startTime: new Date(startTime).toISOString(),
          endTime: new Date(endTime).toISOString(),
          kmInicio: Number(kmInicio) || 0,
          kmFim: Number(kmFim) || 0,
          trips,
          totalViagens: trips.length,
          uberGanhos: Number(uberGanhos) || 0,
          boltGanhos: Number(boltGanhos) || 0,
          extrasGanhos: Number(extrasGanhos) || 0,
          notes,
          status: shift?.status || 'concluido'
        });
      };

      return (
        <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-md p-5 space-y-4 shadow-2xl max-h-[90vh] overflow-y-auto">
            <div className="flex items-center justify-between">
              <h3 className="font-bold text-base text-white">
                {shift ? 'Editar Turno & Viagens' : 'Registar Turno Completo'}
              </h3>
              <button onClick={onClose} className="p-1 text-slate-400 hover:text-white">
                <Icon name="X" className="w-5 h-5" />
              </button>
            </div>

            <form onSubmit={handleSubmit} className="space-y-3 text-xs">
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div>
                  <label className="block text-slate-400 font-semibold mb-1">Início</label>
                  <input
                    type="datetime-local"
                    required
                    value={startTime}
                    onChange={(e) => setStartTime(e.target.value)}
                    className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-emerald-500"
                  />
                </div>
                <div>
                  <label className="block text-slate-400 font-semibold mb-1">Fim</label>
                  <input
                    type="datetime-local"
                    required
                    value={endTime}
                    onChange={(e) => setEndTime(e.target.value)}
                    className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-emerald-500"
                  />
                </div>
              </div>

              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="block text-slate-400 font-semibold mb-1">Km Início</label>
                  <input
                    type="number"
                    required
                    value={kmInicio}
                    onChange={(e) => setKmInicio(e.target.value)}
                    className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-emerald-500"
                  />
                </div>
                <div>
                  <label className="block text-slate-400 font-semibold mb-1">Km Fim</label>
                  <input
                    type="number"
                    required
                    value={kmFim}
                    onChange={(e) => setKmFim(e.target.value)}
                    className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-emerald-500"
                  />
                </div>
              </div>

              <div className="bg-slate-950/90 border border-slate-800 rounded-xl p-3 space-y-2.5">
                <div className="flex items-center justify-between">
                  <span className="font-bold text-slate-200">Viagens do Turno ({trips.length})</span>
                  <span className="text-[10px] text-emerald-400">Soma automática nos totais</span>
                </div>

                <div className="grid grid-cols-12 gap-1.5">
                  <select
                    value={tripPlatform}
                    onChange={(e) => setTripPlatform(e.target.value)}
                    className="col-span-4 bg-slate-900 border border-slate-800 rounded-lg px-2 py-2 text-white focus:outline-none focus:border-emerald-500"
                  >
                    <option value="uber">Uber</option>
                    <option value="bolt">Bolt</option>
                    <option value="extras">Extra</option>
                  </select>
                  <input
                    type="number"
                    step="0.01"
                    placeholder="Valor €"
                    value={tripAmount}
                    onChange={(e) => setTripAmount(e.target.value)}
                    className="col-span-4 bg-slate-900 border border-slate-800 rounded-lg px-2 py-2 text-white focus:outline-none focus:border-emerald-500"
                  />
                  <input
                    type="text"
                    placeholder="Trajeto (opc.)"
                    value={tripNote}
                    onChange={(e) => setTripNote(e.target.value)}
                    className="col-span-4 bg-slate-900 border border-slate-800 rounded-lg px-2 py-2 text-white focus:outline-none focus:border-emerald-500"
                  />
                </div>

                <button
                  type="button"
                  onClick={handleAddTrip}
                  className="w-full bg-slate-800 hover:bg-slate-700 text-emerald-400 font-bold py-2 rounded-lg flex items-center justify-center gap-1 transition border border-slate-700"
                >
                  <Icon name="Plus" className="w-3.5 h-3.5" />
                  Adicionar Viagem
                </button>

                {trips.length > 0 && (
                  <div className="max-h-28 overflow-y-auto space-y-1 pt-1">
                    {trips.map((t) => (
                      <div key={t.id} className="flex items-center justify-between bg-slate-900 px-2.5 py-1.5 rounded-lg border border-slate-800/80">
                        <div className="flex items-center gap-2 truncate">
                          <span className={`uppercase font-bold text-[10px] px-1.5 py-0.5 rounded ${
                            t.platform === 'bolt' ? 'bg-emerald-500/20 text-emerald-400' : 'bg-slate-800 text-slate-300'
                          }`}>
                            {t.platform}
                          </span>
                          <span className="font-bold text-white">€{Number(t.amount).toFixed(2)}</span>
                          {t.note && <span className="text-slate-400 truncate">• {t.note}</span>}
                        </div>
                        <button
                          type="button"
                          onClick={() => handleRemoveTrip(t.id)}
                          className="text-slate-500 hover:text-rose-400 p-0.5"
                        >
                          <Icon name="X" className="w-3.5 h-3.5" />
                        </button>
                      </div>
                    ))}
                  </div>
                )}
              </div>

              <div className="grid grid-cols-3 gap-2">
                <div>
                  <label className="block text-slate-400 font-semibold mb-1">Uber (€)</label>
                  <input
                    type="number"
                    step="0.01"
                    value={uberGanhos}
                    onChange={(e) => setUberGanhos(e.target.value)}
                    className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-emerald-500"
                  />
                </div>
                <div>
                  <label className="block text-slate-400 font-semibold mb-1">Bolt (€)</label>
                  <input
                    type="number"
                    step="0.01"
                    value={boltGanhos}
                    onChange={(e) => setBoltGanhos(e.target.value)}
                    className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-emerald-500"
                  />
                </div>
                <div>
                  <label className="block text-slate-400 font-semibold mb-1">Extras (€)</label>
                  <input
                    type="number"
                    step="0.01"
                    value={extrasGanhos}
                    onChange={(e) => setExtrasGanhos(e.target.value)}
                    className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-emerald-500"
                  />
                </div>
              </div>

              <div>
                <label className="block text-slate-400 font-semibold mb-1">Observações</label>
                <input
                  type="text"
                  value={notes}
                  onChange={(e) => setNotes(e.target.value)}
                  className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-emerald-500"
                />
              </div>

              <div className="flex gap-2 pt-2">
                <button type="button" onClick={onClose} className="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold py-3 rounded-xl transition">
                  Cancelar
                </button>
                <button type="submit" className="flex-1 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold py-3 rounded-xl transition">
                  Guardar Turno
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    function ExpenseModal({ expense, onClose, onSave }) {
      const todayStr = new Date().toISOString().slice(0, 10);
      const [date, setDate] = useState(expense?.date ? expense.date.slice(0, 10) : todayStr);
      const [category, setCategory] = useState(expense?.category || 'combustivel');
      const [amount, setAmount] = useState(expense?.amount || '');
      const [notes, setNotes] = useState(expense?.notes || '');

      const handleSubmit = (e) => {
        e.preventDefault();
        onSave({
          ...(expense || {}),
          date: new Date(date).toISOString(),
          category,
          amount: Number(amount) || 0,
          notes
        });
      };

      return (
        <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-md p-5 space-y-4 shadow-2xl">
            <div className="flex items-center justify-between">
              <h3 className="font-bold text-base text-white">
                {expense ? 'Editar Despesa' : 'Registar Nova Despesa'}
              </h3>
              <button onClick={onClose} className="p-1 text-slate-400 hover:text-white">
                <Icon name="X" className="w-5 h-5" />
              </button>
            </div>

            <form onSubmit={handleSubmit} className="space-y-3 text-xs">
              <div>
                <label className="block text-slate-400 font-semibold mb-1">Data</label>
                <input
                  type="date"
                  required
                  value={date}
                  onChange={(e) => setDate(e.target.value)}
                  className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-white focus:outline-none focus:border-rose-500"
                />
              </div>

              <div>
                <label className="block text-slate-400 font-semibold mb-1">Categoria</label>
                <select
                  value={category}
                  onChange={(e) => setCategory(e.target.value)}
                  className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-white focus:outline-none focus:border-rose-500"
                >
                  {EXPENSE_CATEGORIES.map((cat) => (
                    <option key={cat.id} value={cat.id}>
                      {cat.label}
                    </option>
                  ))}
                </select>
              </div>

              <div>
                <label className="block text-slate-400 font-semibold mb-1">Valor (€)</label>
                <input
                  type="number"
                  step="0.01"
                  required
                  placeholder="0.00"
                  value={amount}
                  onChange={(e) => setAmount(e.target.value)}
                  className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-white focus:outline-none focus:border-rose-500"
                />
              </div>

              <div>
                <label className="block text-slate-400 font-semibold mb-1">Descrição / Notas</label>
                <input
                  type="text"
                  placeholder="Ex: Gasóleo Repsol, Via Verde..."
                  value={notes}
                  onChange={(e) => setNotes(e.target.value)}
                  className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-white focus:outline-none focus:border-rose-500"
                />
              </div>

              <div className="flex gap-2 pt-2">
                <button type="button" onClick={onClose} className="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold py-3 rounded-xl transition">
                  Cancelar
                </button>
                <button type="submit" className="flex-1 bg-rose-500 hover:bg-rose-400 text-slate-950 font-bold py-3 rounded-xl transition">
                  Guardar Despesa
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
