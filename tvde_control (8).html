    // =========================================================================
    // ERROR BOUNDARY — Evita que qualquer falha de renderização parta o ecrã
    // =========================================================================
    class ErrorBoundary extends Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, errorMessage: '' };
      }

      static getDerivedStateFromError(error) {
        return {
          hasError: true,
          errorMessage: error?.message || 'Ocorreu um erro inesperado na aplicação.'
        };
      }

      componentDidCatch(error, info) {
        console.error('Erro capturado pelo ErrorBoundary:', error, info);
      }

      handleReset = () => {
        this.setState({ hasError: false, errorMessage: '' });
      };

      render() {
        if (this.state.hasError) {
          return (
            <div className="min-h-screen bg-slate-950 text-slate-100 flex items-center justify-center p-4">
              <div className="max-w-md w-full bg-slate-900 border border-rose-500/40 rounded-2xl p-6 text-center space-y-4 shadow-2xl">
                <div className="w-12 h-12 rounded-2xl bg-rose-500/15 border border-rose-500/30 flex items-center justify-center mx-auto text-rose-400 font-black text-xl">
                  !
                </div>
                <h2 className="text-lg font-bold text-white">Recuperação da Aplicação</h2>
                <p className="text-xs text-slate-400 leading-relaxed">
                  {this.state.errorMessage}
                </p>
                <button
                  type="button"
                  onClick={this.handleReset}
                  className="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold py-3 rounded-xl text-xs transition"
                >
                  Recarregar Vista
                </button>
              </div>
            </div>
          );
        }
        return this.props.children;
      }
    }

    function toLocalDateKey(dateInput) {
      const d = new Date(dateInput);
      if (isNaN(d.getTime())) return '';
      return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
    }

    // Devolve a Segunda-feira (00:00:00) da semana de uma data
    function getMondayOfDate(dateInput) {
      const d = new Date(dateInput);
      const base = isNaN(d.getTime()) ? new Date() : d;
      const day = base.getDay(); // 0 = Dom, 1 = Seg...
      const diffToMonday = day === 0 ? -6 : 1 - day;
      return new Date(base.getFullYear(), base.getMonth(), base.getDate() + diffToMonday, 0, 0, 0, 0);
    }

    function getWeekOptions(count = 10) {
      const currentMonday = getMondayOfDate(new Date());
      const options = [];
      for (let i = -2; i < count - 2; i++) {
        const monday = new Date(currentMonday.getFullYear(), currentMonday.getMonth(), currentMonday.getDate() - i * 7);
        const sunday = new Date(monday.getFullYear(), monday.getMonth(), monday.getDate() + 6);
        const key = toLocalDateKey(monday);
        const label = `${monday.toLocaleDateString('pt-PT', { day: '2-digit', month: '2-digit' })} a ${sunday.toLocaleDateString('pt-PT', { day: '2-digit', month: '2-digit', year: 'numeric' })}`;
        options.push({ key, label, monday, sunday });
      }
      return options;
    }

    function getMonthOptions(count = 12) {
      const now = new Date();
      const options = [];
      for (let i = 0; i < count; i++) {
        const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
        const key = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
        const rawLabel = d.toLocaleDateString('pt-PT', { month: 'long', year: 'numeric' });
        const label = rawLabel.charAt(0).toUpperCase() + rawLabel.slice(1);
        options.push({ key, label });
      }
      return options;
    }

    // Normaliza ganhos/viagens/portagens/gorjetas de um turno
    function getShiftMetrics(shift) {
      const trips = Array.isArray(shift.trips) ? shift.trips : [];
      let uber = Number(shift.uberGanhos || 0);
      let bolt = Number(shift.boltGanhos || 0);
      let gorjetas = Number(shift.gorjetasGanhos || 0);
      let extras = Number(shift.extrasGanhos || 0);
      let portagens = Number(shift.portagensGanhos || 0);

      if (trips.length > 0) {
        const tripsUber = trips.filter(t => t.platform === 'uber').reduce((s, t) => s + Number(t.amount || 0), 0);
        const tripsBolt = trips.filter(t => t.platform === 'bolt').reduce((s, t) => s + Number(t.amount || 0), 0);
        const tripsGorjetas = trips.reduce((s, t) => s + Number(t.tip || 0), 0);
        const tripsExtras = trips.filter(t => t.platform === 'extras').reduce((s, t) => s + Number(t.amount || 0), 0);
        const tripsPortagens = trips.reduce((s, t) => s + Number(t.toll || 0), 0);

        if (tripsUber > 0 || tripsBolt > 0 || tripsExtras > 0) {
          uber = tripsUber;
          bolt = tripsBolt;
          extras = tripsExtras;
        }
        if (tripsGorjetas > 0) gorjetas = tripsGorjetas;
        if (tripsPortagens > 0) portagens = tripsPortagens;
      }

      // Faturação bruta exclui portagens
      const faturacaoBruta = uber + bolt + gorjetas + extras;
      const kmDiff = Math.max(0, Number(shift.kmFim || 0) - Number(shift.kmInicio || 0));
      let durationHours = 0;
      if (shift.startTime && shift.endTime) {
        const diffMs = new Date(shift.endTime) - new Date(shift.startTime);
        if (diffMs > 0) durationHours = diffMs / (1000 * 60 * 60);
      }
      const ganhoPorKm = kmDiff > 0 ? faturacaoBruta / kmDiff : 0;
      const ganhoPorHora = durationHours > 0 ? faturacaoBruta / durationHours : 0;

      return {
        uber,
        bolt,
        gorjetas,
        extras,
        portagens,
        faturacaoBruta,
        kmDiff,
        durationHours,
        ganhoPorKm,
        ganhoPorHora,
        tripsCount: trips.length || Number(shift.totalViagens || 0)
      };
    }

      const [editingShift, setEditingShift] = useState(null);
      const [editingExpense, setEditingExpense] = useState(null);
      const [toast, setToast] = useState(null);

      // Estado editável do Simulador (chave: YYYY-MM-DD -> { faturacao, automovel })
      const [simOverrides, setSimOverrides] = useState({});

      const showToast = (message, type = 'success') => {

      // Sincroniza estado do modo ecrã inteiro com o documento
      useEffect(() => {
        const handleFullscreenChange = () => {
          setIsFullscreen(Boolean(document.fullscreenElement));
        };
        document.addEventListener('fullscreenchange', handleFullscreenChange);
        return () => document.removeEventListener('fullscreenchange', handleFullscreenChange);
      }, []);

      const toggleFullscreen = async () => {
        try {
          if (!document.fullscreenElement) {
            if (document.documentElement.requestFullscreen) {
              await document.documentElement.requestFullscreen();
            }
          } else if (document.exitFullscreen) {
            await document.exitFullscreen();
          }
        } catch (err) {
          console.error('Erro ao alternar ecrã inteiro:', err);
          showToast('Modo ecrã inteiro indisponível neste contexto.', 'error');
        }
      };

      const persistExpenses = (nextList) => {
        const sorted = [...nextList].sort((a, b) => new Date(b.date) - new Date(a.date));
        setExpenses(sorted);
        try {
          localStorage.setItem('tvde_control_expenses_v1', JSON.stringify(sorted));
          localStorage.setItem('tvde_expenses', JSON.stringify(sorted));
        } catch (err) {
          console.error('Erro ao guardar despesas:', err);
        }
      };

      const persistShifts = (nextList) => {
        const sorted = [...nextList].sort((a, b) => new Date(b.startTime || 0) - new Date(a.startTime || 0));
        setShifts(sorted);
        try {
          localStorage.setItem('tvde_control_shifts_v1', JSON.stringify(sorted));
          localStorage.setItem('tvde_shifts', JSON.stringify(sorted));
        } catch (err) {
          console.error('Erro ao guardar turnos:', err);
        }
      };

      useEffect(() => {
        try {
          const rawShifts = localStorage.getItem('tvde_control_shifts_v1') || localStorage.getItem('tvde_shifts');
          if (rawShifts) {
            const parsed = JSON.parse(rawShifts);
            if (Array.isArray(parsed)) {
              setShifts(parsed.sort((a, b) => new Date(b.startTime || 0) - new Date(a.startTime || 0)));
            }
          }
          const rawExpenses = localStorage.getItem('tvde_control_expenses_v1') || localStorage.getItem('tvde_expenses');
          if (rawExpenses) {
            const parsedExp = JSON.parse(rawExpenses);
            if (Array.isArray(parsedExp)) {
              setExpenses(parsedExp.sort((a, b) => new Date(b.date || 0) - new Date(a.date || 0)));
            }
          }
        } catch (err) {
          console.error('Erro ao carregar dados do localStorage:', err);
        }
      }, []);

      const activeShift = useMemo(() => {
        return shifts.find(s => s.status === 'em_curso') || null;
      }, [shifts]);

      // Função de filtro temporal reutilizada em Resumo, Turnos, Despesas e Gráfico
      const matchesTimePeriod = useMemo(() => {
        const now = new Date();
        const todayKey = toLocalDateKey(now);
        const startOfWeek = getMondayOfDate(now);
        const endOfWeek = new Date(startOfWeek.getFullYear(), startOfWeek.getMonth(), startOfWeek.getDate() + 7);
        const startOfMonth = new Date(now.getFullYear(), now.getMonth(), 1);
        const endOfMonth = new Date(now.getFullYear(), now.getMonth() + 1, 1);

        const chosenMonday = getMondayOfDate(selectedWeek || currentWeekKey);
        const chosenWeekEnd = new Date(chosenMonday.getFullYear(), chosenMonday.getMonth(), chosenMonday.getDate() + 7);

        const [selYearStr, selMonthStr] = (selectedMonth || currentMonthKey).split('-');
        const chosenMonthStart = new Date(Number(selYearStr), Number(selMonthStr) - 1, 1);
        const chosenMonthEnd = new Date(Number(selYearStr), Number(selMonthStr), 1);

        return (dateStr) => {
          const d = new Date(dateStr);
          if (isNaN(d.getTime())) return false;

          if (timePeriod === 'hoje') {
            return toLocalDateKey(d) === todayKey;
          }
          if (timePeriod === 'semana') {
            return d >= startOfWeek && d < endOfWeek;
          }
          if (timePeriod === 'escolher_semana') {
            return d >= chosenMonday && d < chosenWeekEnd;
          }
          if (timePeriod === 'mes') {
            return d >= startOfMonth && d < endOfMonth;
          }
          if (timePeriod === 'escolher_mes') {
            return d >= chosenMonthStart && d < chosenMonthEnd;
          }
          if (timePeriod === 'dia') {
            return toLocalDateKey(d) === selectedDay;
          }
          return true; // 'tudo'
        };
      }, [timePeriod, selectedWeek, selectedMonth, selectedDay, currentWeekKey, currentMonthKey]);

      // Dados filtrados para o período ativo
      const filteredData = useMemo(() => {
        const completedShifts = shifts.filter(s => s.status === 'concluido' && matchesTimePeriod(s.startTime));
        const periodExpenses = expenses.filter(e => matchesTimePeriod(e.date));

        let uberGanhos = 0;
        let boltGanhos = 0;
        let gorjetasGanhos = 0;
        let extrasGanhos = 0;
        let totalPortagens = 0;
        let totalKm = 0;
        let totalHoras = 0;
        let totalViagens = 0;

        completedShifts.forEach(s => {
          const m = getShiftMetrics(s);
          uberGanhos += m.uber;
          boltGanhos += m.bolt;
          gorjetasGanhos += m.gorjetas;
          extrasGanhos += m.extras;
          totalPortagens += m.portagens;
          totalKm += m.kmDiff;
          totalHoras += m.durationHours;
          totalViagens += m.tripsCount;
        });

        // Faturação Bruta sem portagens
        const totalFaturado = uberGanhos + boltGanhos + gorjetasGanhos + extrasGanhos;
        const totalDespesas = periodExpenses.reduce((sum, e) => sum + Number(e.amount || 0), 0);
        const rendaAutomovel = periodExpenses
          .filter(e => e.category === 'automovel')
          .reduce((sum, e) => sum + Number(e.amount || 0), 0);

        const lucroLiquido = totalFaturado - totalDespesas;
        // Recibo Verde: diferença entre Faturação Bruta e Renda do Automóvel menos 6% dessa diferença
        const baseReciboVerde = totalFaturado - rendaAutomovel;
        const deducaoSeisPorCento = baseReciboVerde * 0.06;
        const reciboVerde = baseReciboVerde - deducaoSeisPorCento;

        const mediaEuroHora = totalHoras > 0 ? totalFaturado / totalHoras : 0;
        const mediaEuroKm = totalKm > 0 ? totalFaturado / totalKm : 0;

        return {
          shifts: completedShifts,
          expenses: periodExpenses,
          totalFaturado,
          uberGanhos,
          boltGanhos,
          gorjetasGanhos,
          extrasGanhos,
          totalPortagens,
          totalDespesas,
          rendaAutomovel,
          baseReciboVerde,
          deducaoSeisPorCento,
          lucroLiquido,
          reciboVerde,
          totalKm,
          totalHoras,
          totalViagens,
          mediaEuroHora,
          mediaEuroKm
        };
      }, [shifts, expenses, matchesTimePeriod]);

      // Gráfico que responde ao filtro selecionado (e reflete a semana de Segunda a Domingo)
      const chartData = useMemo(() => {
        const now = new Date();
        const dayNamesShort = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];

        let weekMonday = getMondayOfDate(now);
        if (timePeriod === 'escolher_semana') {
          weekMonday = getMondayOfDate(selectedWeek || currentWeekKey);
        } else if (timePeriod === 'dia') {
          weekMonday = getMondayOfDate(selectedDay);
        }

        if (timePeriod === 'mes' || timePeriod === 'escolher_mes' || timePeriod === 'tudo') {
          const buckets = [];
          if (timePeriod === 'tudo') {
            for (let i = 5; i >= 0; i--) {
              const mDate = new Date(now.getFullYear(), now.getMonth() - i, 1);
              const mKey = `${mDate.getFullYear()}-${String(mDate.getMonth() + 1).padStart(2, '0')}`;
              const label = mDate.toLocaleDateString('pt-PT', { month: 'short' }).replace('.', '');
              let uber = 0, bolt = 0, extras = 0;
              shifts.forEach(s => {
                if (s.status === 'concluido' && s.startTime) {
                  const sd = new Date(s.startTime);
                  const sk = `${sd.getFullYear()}-${String(sd.getMonth() + 1).padStart(2, '0')}`;
                  if (sk === mKey) {
                    const m = getShiftMetrics(s);
                    uber += m.uber;
                    bolt += m.bolt;
                    extras += m.gorjetas + m.extras;
                  }
                }
              });
              buckets.push({ key: mKey, label: label.charAt(0).toUpperCase() + label.slice(1), sub: String(mDate.getFullYear()), uber, bolt, extras, total: uber + bolt + extras });
            }
          } else {
            const [yStr, mStr] = (timePeriod === 'mes' ? currentMonthKey : selectedMonth).split('-');
            const year = Number(yStr);
            const monthIdx = Number(mStr) - 1;
            const daysInMonth = new Date(year, monthIdx + 1, 0).getDate();
            for (let day = 1; day <= daysInMonth; day++) {
              const d = new Date(year, monthIdx, day);
              const key = toLocalDateKey(d);
              let uber = 0, bolt = 0, extras = 0;
              shifts.forEach(s => {
                if (s.status === 'concluido' && s.startTime && toLocalDateKey(s.startTime) === key) {
                  const m = getShiftMetrics(s);
                  uber += m.uber;
                  bolt += m.bolt;
                  extras += m.gorjetas + m.extras;
                }
              });
              buckets.push({ key, label: String(day), sub: dayNamesShort[d.getDay()], uber, bolt, extras, total: uber + bolt + extras });
            }
          }
          const maxTotal = Math.max(...buckets.map(b => b.total), 1);
          return {
            title: timePeriod === 'tudo' ? 'Evolução Mensal (Últimos 6 Meses)' : 'Ganhos Diários do Mês',
            days: buckets,
            maxTotal
          };
        }

        // Semana de Segunda a Domingo (7 dias)
        const days = [];
        for (let i = 0; i < 7; i++) {
          const d = new Date(weekMonday.getFullYear(), weekMonday.getMonth(), weekMonday.getDate() + i);
          const dateKey = toLocalDateKey(d);
          let uber = 0;
          let bolt = 0;
          let extras = 0;

          shifts.forEach(s => {
            if (s.status === 'concluido' && s.startTime && toLocalDateKey(s.startTime) === dateKey) {
              const m = getShiftMetrics(s);
              uber += m.uber;
              bolt += m.bolt;
              extras += m.gorjetas + m.extras;
            }
          });

          days.push({
            key: dateKey,
            label: dayNamesShort[d.getDay()],
            sub: `${d.getDate()}/${d.getMonth() + 1}`,
            uber,
            bolt,
            extras,
            total: uber + bolt + extras
          });
        }

        const maxTotal = Math.max(...days.map(d => d.total), 1);
        return {
          title: 'Ganhos da Semana (Segunda a Domingo)',
          days,
          maxTotal
        };
      }, [shifts, timePeriod, selectedWeek, selectedMonth, selectedDay, currentWeekKey, currentMonthKey]);

      // Guardar ou atualizar turno
      const handleSaveShift = (shiftData) => {
        const exists = shiftData.id && shifts.some(s => s.id === shiftData.id);
        const next = exists
          ? shifts.map(s => (s.id === shiftData.id ? shiftData : s))
          : [{ ...shiftData, id: shiftData.id || ('shift_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6)) }, ...shifts];
        persistShifts(next);
        showToast(shiftData.status === 'em_curso' ? 'Turno iniciado!' : 'Turno guardado com sucesso!');
      };

      const handleDeleteShift = (id) => {
        persistShifts(shifts.filter(s => s.id !== id));
        showToast('Turno eliminado.');
      };

      // Guardar ou atualizar despesa
      const handleSaveExpense = (expenseData) => {
        const exists = expenseData.id && expenses.some(e => e.id === expenseData.id);
        const next = exists
          ? expenses.map(e => (e.id === expenseData.id ? expenseData : e))
          : [{ ...expenseData, id: expenseData.id || ('exp_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6)) }, ...expenses];
        persistExpenses(next);
        showToast('Despesa guardada!');

      // Gerar 7 despesas diárias na categoria "Automóvel" a partir do valor semanal
      const handleGenerateWeeklyCarExpenses = ({ weeklyAmount, weekMondayKey, notes }) => {
        const totalWeekly = Number(weeklyAmount);
        if (!totalWeekly || totalWeekly <= 0) {
          showToast('Insere um valor semanal válido.', 'error');
          return;

        const dailyAmount = Number((totalWeekly / 7).toFixed(2));
        const monday = getMondayOfDate(weekMondayKey);
        const created = [];

        for (let i = 0; i < 7; i++) {
          const dayDate = new Date(monday.getFullYear(), monday.getMonth(), monday.getDate() + i, 12, 0, 0);
          created.push({
            id: `car_${toLocalDateKey(dayDate)}_${Date.now()}_${i}`,
            date: dayDate.toISOString(),
            category: 'automovel',
            amount: dailyAmount,
            notes: `${notes || 'Renda do carro (1/7 semanal)'} • Semana ${toLocalDateKey(monday)}`
          });
        }

        persistExpenses([...created, ...expenses]);
        showToast(`Criadas 7 despesas diárias de €${dailyAmount.toFixed(2)} em Automóvel!`);
      };

      const handleDeleteExpense = (id) => {

          const end = new Date(day.getFullYear(), day.getMonth(), day.getDate(), 17, 30, 0).toISOString();

            status: 'concluido'
          });
        }

        const demoExpenses = [
          {
            id: 'demo_exp_ele_1',
            date: new Date().toISOString(),
            category: 'eletricidade',

            notes: 'Carregamento rápido'
          },
          {
            id: 'demo_exp_aut_1',
            date: new Date().toISOString(),

        persistShifts([...demoShifts, ...shifts]);
        persistExpenses([...demoExpenses, ...expenses]);
        showToast('Dados de demonstração carregados!');

      const renderPeriodFilterBar = () => (
        <div className="bg-slate-900/70 p-2.5 rounded-2xl border border-slate-800 space-y-2">
          <div className="flex flex-wrap items-center gap-1.5">

              <button

                className={`px-3 py-1.5 rounded-xl text-xs font-bold transition ${
                  timePeriod === item.id
                    ? 'bg-emerald-500 text-slate-950 shadow-md shadow-emerald-500/15'
                    : 'bg-slate-950/80 text-slate-400 hover:text-white border border-slate-800/70'
                }`}
              >
                {item.label}
              </button>
            ))}
          </div>

          {timePeriod === 'escolher_semana' && (
            <div className="flex items-center gap-2 pt-1">
              <span className="text-[11px] text-slate-400 font-semibold">Semana:</span>
              <select
                value={selectedWeek}
                onChange={(e) => setSelectedWeek(e.target.value)}
                className="bg-slate-950 border border-emerald-500/40 rounded-xl px-3 py-1.5 text-xs font-semibold text-white focus:outline-none"
              >
                {weekOptions.map(w => (
                  <option key={w.key} value={w.key}>{w.label}</option>
                ))}
              </select>
            </div>
          )}

          {timePeriod === 'escolher_mes' && (
            <div className="flex items-center gap-2 pt-1">
              <span className="text-[11px] text-slate-400 font-semibold">Mês:</span>
              <select
                value={selectedMonth}
                onChange={(e) => setSelectedMonth(e.target.value)}
                className="bg-slate-950 border border-emerald-500/40 rounded-xl px-3 py-1.5 text-xs font-semibold text-white focus:outline-none"
              >
                {monthOptions.map(m => (
                  <option key={m.key} value={m.key}>{m.label}</option>
                ))}
              </select>
            </div>
          )}

          {timePeriod === 'dia' && (
            <div className="flex items-center gap-2 pt-1">
              <span className="text-[11px] text-slate-400 font-semibold">Dia:</span>
              <input
                type="date"
                value={selectedDay}
                onChange={(e) => setSelectedDay(e.target.value)}
                className="bg-slate-950 border border-emerald-500/40 rounded-xl px-3 py-1.5 text-xs font-semibold text-white focus:outline-none"
              />
            </div>
          )}
        </div>
      );

      const visibleShifts = useMemo(() => {
        return shifts.filter(s => matchesTimePeriod(s.startTime));
      }, [shifts, matchesTimePeriod]);

      const visibleExpenses = useMemo(() => {
        return expenses.filter(e => matchesTimePeriod(e.date));
      }, [expenses, matchesTimePeriod]);

      const simDays = useMemo(() => {
        const monday = getMondayOfDate(new Date());
        return [
          { day: 'Segunda', offset: 0 },
          { day: 'Terça', offset: 1 },
          { day: 'Quarta', offset: 2 },
          { day: 'Quinta', offset: 3 },
          { day: 'Sexta', offset: 4 },
          { day: 'Sábado', offset: 5 },
          { day: 'Domingo', offset: 6 },
        ].map(({ day, offset }) => {
          const d = new Date(monday.getFullYear(), monday.getMonth(), monday.getDate() + offset);
          const dateKey = toLocalDateKey(d);

          const baseFaturacao = shifts
            .filter(s => s.status === 'concluido' && s.startTime && toLocalDateKey(s.startTime) === dateKey)
            .reduce((sum, s) => sum + getShiftMetrics(s).faturacaoBruta, 0);

          const baseAutomovel = expenses
            .filter(e => e.category === 'automovel' && e.date && toLocalDateKey(e.date) === dateKey)
            .reduce((sum, e) => sum + Number(e.amount || 0), 0);

          const override = simOverrides[dateKey] || {};
          const faturacaoInput = override.faturacao !== undefined
            ? override.faturacao
            : baseFaturacao.toFixed(2);
          const automovelInput = override.automovel !== undefined
            ? override.automovel
            : baseAutomovel.toFixed(2);

          const faturacaoNum = parseFloat(faturacaoInput) || 0;
          const automovelNum = parseFloat(automovelInput) || 0;
          const ivaNum = (faturacaoNum - automovelNum) * 0.06;
          const aReceberNum = faturacaoNum - automovelNum - ivaNum;

          return {
            day,
            dateKey,
            faturacaoNum,
            automovelNum,
            ivaNum,
            aReceberNum,
            faturacaoInput,
            automovelInput
          };
        });
      }, [shifts, expenses, simOverrides]);

      const totalSimFaturacao = simDays.reduce((acc, item) => acc + item.faturacaoNum, 0);
      const totalSimAutomovel = simDays.reduce((acc, item) => acc + item.automovelNum, 0);
      const totalSimIva = simDays.reduce((acc, item) => acc + item.ivaNum, 0);
      const totalSimAReceber = simDays.reduce((acc, item) => acc + item.aReceberNum, 0);

      const handleSimChange = (dateKey, field, rawValue) => {
        setSimOverrides(prev => ({
          ...prev,
          [dateKey]: {
            ...(prev[dateKey] || {}),
            [field]: rawValue
          }
        }));
      };

      return (
        <div className="min-h-screen bg-slate-950 text-slate-100 flex flex-col pb-24 md:pb-8">
          {toast && (
            <div className={`fixed top-4 left-1/2 -translate-x-1/2 z-50 px-4 py-3 rounded-xl shadow-2xl flex items-center gap-2.5 border text-xs font-bold ${
              toast.type === 'error'
                ? 'bg-rose-950/95 border-rose-500/50 text-rose-200'
                : 'bg-emerald-950/95 border-emerald-500/50 text-emerald-200'
            }`}>
              <Icon name={toast.type === 'error' ? 'info' : 'check'} className="w-4 h-4 shrink-0" />
              <span>{toast.message}</span>
            </div>
          )}

          {/* CABEÇALHO */}
          <header className="sticky top-0 z-40 bg-slate-900/90 backdrop-blur-md border-b border-slate-800 px-4 py-3">
            <div className="max-w-5xl mx-auto flex items-center justify-between gap-3">
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-emerald-500 to-teal-400 flex items-center justify-center text-slate-950 shadow-lg shadow-emerald-500/20">
                  <Icon name="car" className="w-5 h-5" />
                </div>
                <div>
                  <h1 className="font-black text-base sm:text-lg tracking-tight text-white">TVDE Control</h1>
                  <span className="text-[10px] font-bold uppercase tracking-wider text-emerald-400">
                    Marco Pereira
                  </span>
                </div>
              </div>

              <div className="flex items-center gap-2">
                <button
                  type="button"
                  onClick={toggleFullscreen}
                  title={isFullscreen ? 'Sair de ecrã inteiro' : 'Abrir em ecrã inteiro'}
                  aria-label={isFullscreen ? 'Sair de ecrã inteiro' : 'Abrir em ecrã inteiro'}
                  className="bg-slate-800/80 hover:bg-slate-700 text-slate-200 border border-slate-700/80 p-2 rounded-xl text-xs flex items-center justify-center transition"
                >
                  <Icon name={isFullscreen ? 'minimize' : 'maximize'} className="w-4 h-4 text-emerald-400" />
                </button>

                <button
                  type="button"
                  onClick={() => setIsCarModalOpen(true)}
                  title="Renda semanal do carro (gera 7 despesas em Automóvel)"
                  className="bg-amber-500/15 hover:bg-amber-500/25 text-amber-300 border border-amber-500/30 font-bold px-3 py-2 rounded-xl text-xs flex items-center gap-1.5 transition"
                >
                  <Icon name="car" className="w-4 h-4" />
                  <span>Carro</span>
                </button>

                {!activeShift && (
                  <button

                    className="bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold px-3.5 py-2 rounded-xl text-xs flex items-center gap-1.5 transition shadow-lg shadow-emerald-500/20"
                  >

          </header>

          {/* BANNER DE TURNO ATIVO */}
          {activeShift && (

              <div className="max-w-5xl mx-auto flex flex-wrap items-center justify-between gap-3">

          {/* CONTEÚDO PRINCIPAL */}
          <main className="flex-1 max-w-5xl w-full mx-auto px-4 py-5 space-y-5">
            {activeTab === 'resumo' && (

                {/* CARTÕES PRINCIPAIS */}
                <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
                  <div className="col-span-2 bg-gradient-to-br from-slate-900 to-emerald-950/40 p-4 rounded-2xl border border-emerald-500/30 shadow-xl">
                    <div className="flex items-center justify-between text-slate-400 text-xs font-semibold mb-1">
                      <span>Lucro Líquido Real</span>
                      <span className="text-emerald-400 font-bold bg-emerald-500/10 px-2 py-0.5 rounded-md border border-emerald-500/20">Final</span>
                    </div>
                    <div className="text-3xl sm:text-4xl font-black text-emerald-400">
                      €{filteredData.lucroLiquido.toFixed(2)}
                    </div>
                    <p className="text-[11px] text-slate-400 mt-2">
                      Faturação Bruta (€{filteredData.totalFaturado.toFixed(2)}) - Todas as Despesas (€{filteredData.totalDespesas.toFixed(2)})
                    </p>
                  </div>

                  <button
                    type="button"
                    onClick={() => setIsReciboVerdeModalOpen(true)}
                    className="col-span-2 text-left bg-gradient-to-br from-slate-900 to-teal-950/40 hover:border-teal-400/60 p-4 rounded-2xl border border-teal-500/30 shadow-xl transition group cursor-pointer"
                  >
                    <div className="flex items-center justify-between text-slate-400 text-xs font-semibold mb-1">
                      <span>Recibo Verde</span>

                    <div className="text-3xl sm:text-4xl font-black text-teal-300">

                          csv += `"${new Date(e.date).toLocaleDateString('pt-PT')}";"${cat}";${Number(e.amount || 0).toFixed(2)};"${e.notes || ''}"\n`;

                  value={notes}
                  onChange={(e) => setNotes(e.target.value)}
                  className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-white focus:outline-none focus:border-amber-400"
                />
              </div>

              <div className="bg-slate-950 border border-amber-500/20 rounded-xl p-3 flex items-center justify-between">
                <span className="text-slate-400">Valor diário (÷ 7 dias, categoria Automóvel):</span>
                <span className="font-black text-sm text-amber-300">€{dailyPreview.toFixed(2)} / dia</span>
              </div>

              <div className="flex gap-2 pt-2">
                <button type="button" onClick={onClose} className="flex-1 bg-slate-800 py-3 rounded-xl font-bold text-slate-300">Cancelar</button>
                <button type="submit" className="flex-1 bg-amber-400 hover:bg-amber-300 py-3 rounded-xl font-bold text-slate-950">Gerar 7 Despesas</button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    function ReciboVerdeDetailModal({ data, onClose }) {
      const faturacaoBruta = Number(data?.totalFaturado || 0);
      const rendaAutomovel = Number(data?.rendaAutomovel || 0);
      const diferenca = Number(data?.baseReciboVerde ?? (faturacaoBruta - rendaAutomovel));
      const deducao6 = Number(data?.deducaoSeisPorCento ?? (diferenca * 0.06));
      const totalReciboVerde = Number(data?.reciboVerde ?? (diferenca - deducao6));

      return (
        <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-slate-900 border border-teal-500/40 rounded-2xl w-full max-w-md p-5 space-y-4 shadow-2xl">
            <div className="flex items-center justify-between">
              <h3 className="font-bold text-base text-white flex items-center gap-2">
                <Icon name="receipt" className="w-4 h-4 text-teal-300" />
                Detalhe do Cálculo — Recibo Verde
              </h3>
              <button type="button" onClick={onClose} className="text-slate-400 hover:text-white">
                <Icon name="x" className="w-5 h-5" />
              </button>
            </div>

            <div className="bg-slate-950 border border-slate-800 rounded-xl p-4 space-y-3 text-xs">
              <div className="flex items-center justify-between">
                <span className="text-slate-400">1. Faturação Bruta (s/ portagens)</span>
                <span className="font-bold text-white">€{faturacaoBruta.toFixed(2)}</span>
              </div>

              <div className="flex items-center justify-between">
                <span className="text-slate-400">2. Renda Automóvel (despesas Automóvel)</span>
                <span className="font-bold text-amber-300">- €{rendaAutomovel.toFixed(2)}</span>
              </div>

              <div className="border-t border-slate-800 pt-2.5 flex items-center justify-between">
                <span className="text-slate-300 font-semibold">3. Diferença (Faturação − Automóvel)</span>
                <span className="font-bold text-slate-100">€{diferenca.toFixed(2)}</span>
              </div>

              <div className="flex items-center justify-between">
                <span className="text-slate-400">4. Dedução IVA / Taxa (6% da diferença)</span>
                <span className="font-bold text-rose-400">- €{deducao6.toFixed(2)}</span>
              </div>

              <div className="border-t-2 border-teal-500/30 pt-3 flex items-center justify-between">
                <span className="text-sm font-bold text-teal-300">Valor Final Recibo Verde</span>
                <span className="text-xl font-black text-teal-300">€{totalReciboVerde.toFixed(2)}</span>
              </div>
            </div>

            <p className="text-[11px] text-slate-400 leading-relaxed">
              Fórmula aplicada: <span className="text-slate-200 font-semibold">(Faturação Bruta − Renda Automóvel) − 6%</span>. Os valores refletem o período de filtro ativo no Resumo.
            </p>

            <button
              type="button"
              onClick={onClose}
              className="w-full bg-teal-400 hover:bg-teal-300 text-slate-950 font-bold py-3 rounded-xl text-xs transition"
            >
              Fechar
            </button>
          </div>
        </div>
      );
    }

    const rootEl = document.getElementById('root');
    ReactDOM.createRoot(rootEl).render(
      <ErrorBoundary>
        <App />
      </ErrorBoundary>
    );
  </script>
</body>
</html>
